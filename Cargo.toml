[workspace]
resolver = "2"
members = [
    "crates/brain-core",
    "crates/brain-extract",
    "crates/brain-layout",
    "crates/brain-index",
    "crates/brain-store",
    "crates/brain-query",
    "crates/brain-wiki",
    "crates/brain-cli",
    "crates/brain-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Quyzi/daddy"

[workspace.dependencies]
brain-core = { path = "crates/brain-core" }
brain-extract = { path = "crates/brain-extract" }
brain-layout = { path = "crates/brain-layout" }
brain-index = { path = "crates/brain-index" }
brain-store = { path = "crates/brain-store" }
brain-query = { path = "crates/brain-query" }
brain-wiki = { path = "crates/brain-wiki" }
brain-mcp = { path = "crates/brain-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
rayon = "1"
sha2 = "0.10"
which = "6"
tempfile = "3"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
aho-corasick = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.36"
zstd = "0.13"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
