[package]
name = "brain-mcp"
description = "MCP (Model Context Protocol) server exposing explore/get/page/stats over a brain's graph."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brain-core.workspace = true
brain-store.workspace = true
brain-query.workspace = true
rmcp = { version = "0.15", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
